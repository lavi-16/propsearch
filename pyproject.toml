[project]
name = "propsearch-data"
version = "0.1.0"
description = "Bronze/silver/gold pipeline for Thurgau parcel due-diligence data"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "owslib>=0.31",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "geoalchemy2>=0.20.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
